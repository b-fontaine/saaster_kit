          credentials: true
          max_age: 3600
    routes:
      - name: grafana-route
        protocols: ["http","https"]
        paths: ["/grafana"]
        strip_path: false
        preserve_host: true

  - name: customer_service-grpc
    url: grpc://customer_service:50051
    plugins:
      - name: request-transformer
        config:
          add:
            headers: ["Authorization:${headers.authorization}"]
      - name: oauth2
        config:
          enable_authorization_code: true
          enable_client_credentials: true
          enable_password_grant: false
          global_credentials: false
          token_expiration: 7200
          scopes: ["read", "write"]
          mandatory_scope: false
          hide_credentials: false
          enable_implicit_grant: false
          accept_http_if_already_terminated: true
          reuse_refresh_token: true
          auth_header_name: "Authorization"
          refresh_token_ttl: 1209600
          provision_key: "your-provision-key"
    routes:
      - name: customer_service-route
        protocols: ["grpc"]
        paths: ["/grpc/customer_service"]
        strip_path: false

  - name: customer-get
    url: grpc://customer_service:50051
    plugins:
      - name: grpc-gateway
        config:
          proto: /kong/proto/customer.proto
      - name: request-transformer
        config:
          add:
            headers: ["Authorization:${headers.authorization}"]
      - name: oauth2
        config:
          enable_authorization_code: true
          enable_client_credentials: true
          enable_password_grant: false
          global_credentials: false
          token_expiration: 7200
          scopes: ["read", "write"]
          mandatory_scope: false
          hide_credentials: false
          enable_implicit_grant: false
          accept_http_if_already_terminated: true
          reuse_refresh_token: true
          auth_header_name: "Authorization"
          refresh_token_ttl: 1209600
          provision_key: "your-provision-key"
    routes:
      - name: customer-get-route
        protocols: ["http", "https"]
        paths: ["/api/v1/customer"]
        methods: ["GET"]
        strip_path: false

