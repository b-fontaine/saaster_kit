_format_version: "1.1"

plugins:
  - name: safeline
    config:
      host: safeline-detector
      port: 8000
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET","POST","PUT","DELETE","OPTIONS"]
      headers: ["Authorization","Content-Type","X-Requested-With"]
      credentials: true
      max_age: 3600

services:
  - name: kong-admin
    url: http://kong:8001
    plugins:
    routes:
      - name: kong-admin-route
        protocols: ["http","https"]
        paths: ["/kong-admin"]
        strip_path: false
        preserve_host: true

  - name: widgetbook
