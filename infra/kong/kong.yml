consumers:
  - username: api-client
    custom_id: api-client-1
    oauth2_credentials:
    - name: "API Client"
      client_id: "client-id"
      client_secret: "client-secret"
      redirect_uris: ["http://localhost:80/callback"]
      hash_secret: false
