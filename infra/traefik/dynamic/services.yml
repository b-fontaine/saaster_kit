http:
  routers:

    client-manager:
      rule: "PathPrefix(`/api/clients`)"
      service: client-manager
      entrypoints:
        - web
      middlewares:
        - cors

    keycloak:
      rule: "PathPrefix(`/auth`)"
      service: keycloak
      entrypoints:
        - web

    temporal-ui:
      rule: "PathPrefix(`/temporal`)"
      service: temporal-ui
      entrypoints:
        - web

  services:

    client-manager:
      loadBalancer:
        servers:
          - url: "http://client_manager:8080"

    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"

    temporal-ui:
      loadBalancer:
        servers:
          - url: "http://temporal-ui:8080"
