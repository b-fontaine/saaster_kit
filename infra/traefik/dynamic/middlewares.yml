http:
  middlewares:
    cors:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true

    strip-temporal-prefix:
      stripPrefix:
        prefixes:
          - "/temporal"
        forceSlash: true

    # Temporarily disabled ModSecurity WAF middleware
    # waf:
    #   plugin:
    #     modsecurity:
    #       modSecurityUrl: "http://modsecurity:80"
    #       timeoutMillis: 5000
    #       maxBodySize: 10485760

    # Strip prefix middlewares for various services
    strip-grafana-prefix:
      stripPrefix:
        prefixes:
          - "/grafana"
        forceSlash: true
