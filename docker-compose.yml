services:
  # Gateway & WAF
  kong:
    build:
      context: ./infra/kong/docker
      dockerfile: Dockerfile
    container_name: kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_DECLARATIVE_CONFIG_MERGE: "true"
      KONG_DECLARATIVE_CONFIG_MERGE_LIST: /etc/kong/routes.yml
      KONG_PLUGINS: bundled,grpc-gateway,cors,request-transformer,safeline
      KONG_SSL: "on"
      KONG_SSL_CERT: /etc/kong/localhost.crt
      KONG_SSL_CERT_KEY: /etc/kong/localhost.key
    volumes:
      - ./infra/kong/kong.yml:/etc/kong/kong.yml
      - ./infra/kong/routes.yml:/etc/kong/routes.yml
      - ./infra/kong/localhost.crt:/etc/kong/localhost.crt
      - ./infra/kong/localhost.key:/etc/kong/localhost.key
      - ./backend/customer_service/proto:/kong/proto
    networks:
      - saaster-network
      - kong-network
      - safeline-ce
    ports:
      - "80:8000"   # HTTP proxy
      - "443:8443"   # HTTPS proxy
      - "8001:8001"   # Admin API
      - "8444:8444"   # Admin HTTPS
    depends_on:
      keycloak:
        condition: service_started
      webapp:
        condition: service_started
      safeline-tengine:
        condition: service_started
      safeline-chaos:
        condition: service_started
      safeline-luigi:
        condition: service_started
      safeline-fvm:
        condition: service_started
      safeline-mgt:
        condition: service_started
      safeline-detect:
        condition: service_started
      safeline-postgres:
        condition: service_started

  safeline-postgres:
    container_name: safeline-pg
    restart: always
    image: ${IMAGE_PREFIX}/safeline-postgres${ARCH_SUFFIX}:15.2
    volumes:
      - ${SAFELINE_DIR}/resources/postgres/data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - POSTGRES_USER=safeline-ce
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?postgres password required}
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.2
    command: [postgres, -c, max_connections=600]
    healthcheck:
      test: pg_isready -U safeline-ce -d safeline-ce
  safeline-mgt:
    container_name: safeline-mgt
    restart: always
    image: ${IMAGE_PREFIX}/safeline-mgt${REGION}${ARCH_SUFFIX}:${IMAGE_TAG:?image tag required}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SAFELINE_DIR}/resources/mgt:/app/data
      - ${SAFELINE_DIR}/logs/nginx:/app/log/nginx:z
      - ${SAFELINE_DIR}/resources/sock:/app/sock
      - /var/run:/app/run
    ports:
      - "9443:1443"
    healthcheck:
      test: curl -k -f https://localhost:1443/api/open/health
    environment:
      - MGT_PG=postgres://safeline-ce:${POSTGRES_PASSWORD}@safeline-pg/safeline-ce?sslmode=disable
    depends_on:
      - safeline-postgres
      - safeline-fvm
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.4
  safeline-detect:
    container_name: safeline-detector
    restart: always
    image: ${IMAGE_PREFIX}/safeline-detector${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    volumes:
      - ${SAFELINE_DIR}/resources/detector:/resources/detector
      - ${SAFELINE_DIR}/logs/detector:/logs/detector
      - /etc/localtime:/etc/localtime:ro
    environment:
      - LOG_DIR=/logs/detector
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.5
  safeline-tengine:
    container_name: safeline-tengine
    restart: always
    image: ${IMAGE_PREFIX}/safeline-tengine${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/resolv.conf:/etc/resolv.conf:ro
      - ${SAFELINE_DIR}/resources/nginx:/etc/nginx
      - ${SAFELINE_DIR}/resources/detector:/resources/detector
      - ${SAFELINE_DIR}/resources/chaos:/resources/chaos
      - ${SAFELINE_DIR}/logs/nginx:/var/log/nginx:z
      - ${SAFELINE_DIR}/resources/cache:/usr/local/nginx/cache
      - ${SAFELINE_DIR}/resources/sock:/app/sock
    environment:
      - TCD_MGT_API=https://${SUBNET_PREFIX}.4:1443/api/open/publish/server
      - TCD_SNSERVER=${SUBNET_PREFIX}.5:8000
      # deprecated
      - SNSERVER_ADDR=${SUBNET_PREFIX}.5:8000
      - CHAOS_ADDR=${SUBNET_PREFIX}.10
    ulimits:
      nofile: 131072
    network_mode: host
  safeline-luigi:
    container_name: safeline-luigi
    restart: always
    image: ${IMAGE_PREFIX}/safeline-luigi${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    environment:
      - MGT_IP=${SUBNET_PREFIX}.4
      - LUIGI_PG=postgres://safeline-ce:${POSTGRES_PASSWORD}@safeline-pg/safeline-ce?sslmode=disable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${SAFELINE_DIR}/resources/luigi:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    depends_on:
      - safeline-detect
      - safeline-mgt
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.7
  safeline-fvm:
    container_name: safeline-fvm
    restart: always
    image: ${IMAGE_PREFIX}/safeline-fvm${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.8
  safeline-chaos:
    container_name: safeline-chaos
    restart: always
    image: ${IMAGE_PREFIX}/safeline-chaos${REGION}${ARCH_SUFFIX}:${IMAGE_TAG}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    environment:
      - DB_ADDR=postgres://safeline-ce:${POSTGRES_PASSWORD}@safeline-pg/safeline-ce?sslmode=disable
    volumes:
      - ${SAFELINE_DIR}/resources/sock:/app/sock
      - ${SAFELINE_DIR}/resources/chaos:/app/chaos
    networks:
      safeline-ce:
        ipv4_address: ${SUBNET_PREFIX}.10

  # Observability
  elasticsearch:
    container_name: saaster-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    networks:
      - monitoring-network
      - temporal-network
    expose:
      - 9200
    volumes:
      - elasticsearch_data:/var/lib/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://localhost/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    expose:
      - "3000"
    networks:
      - saaster-network
      - monitoring-network
    depends_on:
      - prometheus
      - elasticsearch
    restart: unless-stopped

  # Orchestration
  temporal-postgresql:
    container_name: temporal-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    image: postgres:${POSTGRESQL_VERSION}
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 5
  temporal:
    container_name: temporal
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_DB=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/docker.yaml
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - SERVICES=history,matching,frontend,worker
      - LOG_LEVEL=info
    image: temporalio/auto-setup:${TEMPORAL_VERSION}
    networks:
      - temporal-network
    volumes:
      - ./infra/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7233/health || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 60s
  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION}
    networks:
      - temporal-network
    stdin_open: true
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "namespace", "list"]
      interval: 5s
      timeout: 5s
      retries: 5
    tty: true
  temporal-ui:
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost/temporal
      - TEMPORAL_UI_PORT=8080
      - TEMPORAL_UI_PUBLIC_PATH=/temporal
    image: temporalio/ui:${TEMPORAL_UI_VERSION}
    networks:
      - saaster-network
      - temporal-network

  # IAM
  postgres:
    image: postgres:15.6
    container_name: postgres_keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - keycloak-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    volumes:
      - ./infra/keycloak/imports:/opt/keycloak/data/import
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password

      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_RELATIVE_PATH: /auth

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm --verbose
    depends_on:
      - postgres
    networks:
      - saaster-network
      - keycloak-network

  # Frontends
  website:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - FOLDER=website
        - BASE_HREF=/
    container_name: website
    networks:
      - kong-network
    restart: on-failure

  widgetbook:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - FOLDER=design_system/widgetbook
        - BASE_HREF=/widgetbook/
    container_name: widgetbook
    networks:
      - kong-network
    restart: on-failure

  webapp:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - FOLDER=main_app
        - BASE_HREF=/app/
    container_name: webapp
    networks:
      - kong-network
    restart: on-failure

  # Customer Service Microservice
  customer_service_db:
    image: postgres:${POSTGRESQL_VERSION}
    container_name: customer_service_db
    environment:
      POSTGRES_DB: customer_service_db
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: password
    volumes:
      - customer_service_db_data:/var/lib/postgresql/data
    networks:
      - customer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_service -d customer_service_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  customer_service:
    build:
      context: ./backend/customer_service
      dockerfile: Dockerfile
    container_name: customer_service
    depends_on:
      customer_service_db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend/customer_service/scripts:/app/scripts
    environment:
      - GRPC_PORT=50051
      - DB_HOST=customer_service_db
      - DB_PORT=5432
      - DB_USER=customer_service
      - DB_PASSWORD=password
      - DB_NAME=customer_service_db
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=customer-namespace
      - TEMPORAL_TASK_QUEUE=customer-service-task-queue
      - OTLP_ENDPOINT=otel-collector:4317
      - ELASTIC_URL=http://elasticsearch:9200
      - ELASTIC_INDEX=customer-service-logs
      - KEYCLOAK_URL=http://keycloak:8080
    networks:
      - kong-network
      - customer-network
      - temporal-network
      - monitoring-network
    restart: on-failure

networks:
  saaster-network:
    driver: bridge
    name: saaster-network
  temporal-network:
    driver: bridge
    name: temporal-network
  keycloak-network:
    driver: bridge
    name: keycloak-network
  kong-network:
    driver: bridge
    name: kong-network
  customer-network:
    driver: bridge
    name: customer-network
  monitoring-network:
    driver: bridge
    name: monitoring-network

  safeline-ce:
    name: safeline-ce
    driver: bridge
    ipam:
      driver: default
      config:
        - gateway: ${SUBNET_PREFIX:?SUBNET_PREFIX required}.1
          subnet: ${SUBNET_PREFIX}.0/24
    driver_opts:
      com.docker.network.bridge.name: safeline-ce

volumes:
  postgres_data:
  customer_service_db_data:
  temporal_postgres_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
