  <path d="M650,150 C660,140 670,140 680,150 C690,160 690,170 680,180 C670,190 660,190 650,180 C640,170 640,160 650,150" 
        stroke="#6200EE" stroke-width="2" fill="none" stroke-opacity="0.05" />
  
  <!-- Wavy lines with different amplitudes -->
  <path d="M0,550 C25,530 50,570 75,550 C100,530 125,570 150,550 C175,530 200,570 225,550 C250,530 275,570 300,550 C325,530 350,570 375,550 C400,530 425,570 450,550 C475,530 500,570 525,550 C550,530 575,570 600,550 C625,530 650,570 675,550 C700,530 725,570 750,550 C775,530 800,570 825,550" 
        stroke="#03DAC6" stroke-width="1.5" fill="none" stroke-opacity="0.05" />
  
  <path d="M0,50 C50,20 100,80 150,50 C200,20 250,80 300,50 C350,20 400,80 450,50 C500,20 550,80 600,50 C650,20 700,80 750,50" 
        stroke="#6200EE" stroke-width="1.5" fill="none" stroke-opacity="0.05" />
