<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Wave patterns and curved lines for parallax background -->
  
  <!-- Gentle waves -->
  <path d="M0,100 C100,80 200,120 300,100 C400,80 500,120 600,100 C700,80 800,120 900,100" 
        stroke="#6200EE" stroke-width="2" fill="none" stroke-opacity="0.05" />
  
  <path d="M0,200 C100,180 200,220 300,200 C400,180 500,220 600,200 C700,180 800,220 900,200" 
        stroke="#03DAC6" stroke-width="2" fill="none" stroke-opacity="0.05" />
  
  <path d="M0,300 C100,280 200,320 300,300 C400,280 500,320 600,300 C700,280 800,320 900,300" 
        stroke="#6200EE" stroke-width="2" fill="none" stroke-opacity="0.05" />
  
  <!-- Flowing curves -->
  <path d="M100,400 C150,350 200,450 250,400 C300,350 350,450 400,400" 
        stroke="#03DAC6" stroke-width="3" fill="none" stroke-opacity="0.05" />
  
  <path d="M400,450 C450,400 500,500 550,450 C600,400 650,500 700,450" 
        stroke="#6200EE" stroke-width="3" fill="none" stroke-opacity="0.05" />
  
  <!-- Spiral elements -->
  <path d="M150,500 C160,490 170,490 180,500 C190,510 190,520 180,530 C170,540 160,540 150,530 C140,520 140,510 150,500" 
