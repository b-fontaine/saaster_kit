name: saaster_kit_website
description: "Presentation website for the SaaSter Kit."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  design_system:
    path: ../design_system
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  responsive_framework: ^1.5.1
  url_launcher: ^6.3.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
